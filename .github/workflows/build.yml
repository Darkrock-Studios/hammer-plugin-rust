name: Build

# Tests and packages the plugin on every push and pull request. Pushing a tag such as v0.1.0 also makes a
# GitHub release with the .hammerplugin attached, which writers can download and install.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # While hammer-plugin-sdk is private, a token that can read it. Once it's public, delete the secret.
      SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Read the private SDK
        if: env.SDK_TOKEN != ''
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/Darkrock-Studios/".insteadOf "https://github.com/Darkrock-Studios/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test

      - name: Package
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/*.hammerplugin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/*.hammerplugin
